# Jeder Push auf main baut die Seite und stellt sie auf Vercel live.
# Zugang über Secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) –
# wer am Repo mitarbeitet, braucht kein eigenes Vercel-Konto.
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seite bauen
        run: node build.mjs
      - name: Auf Vercel veröffentlichen
        working-directory: dist
        run: npx --yes vercel@latest deploy --prod --yes --archive=tgz --token "${{ secrets.VERCEL_TOKEN }}"
